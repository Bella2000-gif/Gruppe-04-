<meta name="robots" content="noindex, nofollow">
<title>Vignettenstudie Vorschau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#e6e9ef; --card:#ffffff; --card-2:#f3f5f8;
  --ink:#1a212b; --ink-2:#5b6573; --ink-3:#8b95a3;
  --rule:#d7dce3; --rule-2:#e8ebf0;
  --blue:#2560c4; --blue-soft:#e8f0fc;
  --regie:#8c4a2f; --regie-soft:#f7ece5; --regie-rule:#e0c7b6;
  --ok:#2f7049; --warn:#b4522e; --violet:#5b4fc7;
  --sans:"Source Sans 3",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12151a; --card:#1b2029; --card-2:#232a34;
    --ink:#e6eaf0; --ink-2:#99a3b1; --ink-3:#717d8c;
    --rule:#2d343f; --rule-2:#262d37;
    --blue:#76abf0; --blue-soft:#1b2a3f;
    --regie:#e3a37c; --regie-soft:#2b2019; --regie-rule:#4a382c;
    --ok:#73b68d; --warn:#e0906b; --violet:#9b91ea;
  }
}
:root[data-theme="dark"]{
  --ground:#12151a; --card:#1b2029; --card-2:#232a34;
  --ink:#e6eaf0; --ink-2:#99a3b1; --ink-3:#717d8c;
  --rule:#2d343f; --rule-2:#262d37;
  --blue:#76abf0; --blue-soft:#1b2a3f;
  --regie:#e3a37c; --regie-soft:#2b2019; --regie-rule:#4a382c;
  --ok:#73b68d; --warn:#e0906b; --violet:#9b91ea;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---------- Regieleiste ---------- */
.leiste{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--rule)}
.leiste-innen{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.marke{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.marke b{font-family:var(--serif);font-size:17px;font-weight:600}
.marke span{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--regie)}
.gruppen{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gruppen .gl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.gbtn{font-family:var(--mono);font-size:12px;font-weight:500;padding:6px 11px;border-radius:3px;
  border:1px solid var(--rule);background:var(--card-2);color:var(--ink-2);transition:all .12s}
.gbtn:hover{border-color:var(--regie);color:var(--ink)}
.gbtn[aria-pressed="true"]{background:var(--regie);border-color:var(--regie);color:#fff}
.gbtn.wuerfel{background:transparent;border-style:dashed}
.schalter{display:flex;gap:4px;border:1px solid var(--rule);border-radius:3px;padding:2px;background:var(--card-2)}
.schalter button{font-size:13px;padding:5px 11px;border:0;border-radius:2px;background:transparent;color:var(--ink-2)}
.schalter button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.regieschalter{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.regieschalter input{accent-color:var(--regie);width:15px;height:15px}
.zustand{width:100%;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);border-top:1px solid var(--rule-2);padding-top:9px}
.zustand b{color:var(--ink-2);font-weight:500}
.fortschritt{flex:1 1 140px;height:4px;background:var(--rule);border-radius:2px;overflow:hidden;min-width:100px}
.fortschritt i{display:block;height:100%;background:var(--blue);transition:width .25s}

/* ---------- Bühne ---------- */
.buehne{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
.karte{background:var(--card);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:0 auto;max-width:620px}
.ueber{max-width:620px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.ueber .block{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.ueber .zaehler{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.karte-innen{padding:30px 34px}
h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;margin:0 0 16px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:26px 0 10px;text-wrap:balance}
p{margin:0 0 13px}
p:last-child{margin-bottom:0}
.intro{color:var(--ink-2)}
.anrede{font-size:17px}
hr{border:0;border-top:1px solid var(--rule-2);margin:22px 0}

/* ---------- Items ---------- */
.item{padding:17px 0;border-top:1px solid var(--rule-2)}
.item:first-of-type{border-top:0}
.item.versteckt{display:none}
.frage{display:flex;gap:9px;align-items:baseline;margin-bottom:11px}
.frage .nr{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;padding-top:3px;min-width:26px}
.frage .txt{font-size:16px;flex:1}
.frage .txt em{font-style:normal;color:var(--ink-3);font-size:13px;display:block;margin-top:2px}
.pflicht{color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:7px;padding-left:35px}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;cursor:pointer;color:var(--ink)}
.opt input{accent-color:var(--blue);margin:3px 0 0;width:16px;height:16px;flex:none}
.opt span{flex:1}
input[type="number"],input[type="text"]{font-family:var(--sans);font-size:15.5px;color:var(--ink);
  background:var(--card-2);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;max-width:180px;width:100%}
input:focus-visible,button:focus-visible,.opt input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Skala */
.skala{padding-left:35px}
.pole{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-3);margin-bottom:7px}
.punkte{display:flex;gap:4px}
.punkt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  padding:7px 2px;border:1px solid var(--rule-2);border-radius:3px;background:var(--card-2);transition:border-color .12s}
.punkt:hover{border-color:var(--blue)}
.punkt input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.punkt .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.punkt .lab{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.25;min-height:2.4em}
.punkt:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
@media (max-width:700px){ .punkt .lab{display:none} .skala,.opts{padding-left:0} .frage .nr{min-width:0} }

/* Einwilligung */
.einwilligung{display:flex;gap:11px;align-items:flex-start;background:var(--card-2);border:1px solid var(--rule);
  border-left:3px solid var(--blue);border-radius:0 3px 3px 0;padding:14px 16px;font-size:15.5px;cursor:pointer}
.einwilligung input{accent-color:var(--blue);width:18px;height:18px;margin:2px 0 0;flex:none}

/* Vignette */
.bild{margin:18px 0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card-2)}
.bild img{display:block;width:100%;height:auto}
.bildunter{font-size:13px;color:var(--ink-3);margin-top:-6px;margin-bottom:18px;font-style:italic}
.audio{display:flex;gap:12px;align-items:center;background:var(--card-2);border:1px solid var(--rule);
  border-radius:3px;padding:12px 15px;margin:4px 0 16px;font-size:14px;color:var(--ink-2)}
.audio .sym{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.transkript{border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 16px;color:var(--ink);font-size:15.5px}
.transkript .kopf{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
textarea{width:100%;min-height:92px;font-family:var(--sans);font-size:15.5px;color:var(--ink);
  background:var(--card-2);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;resize:vertical}

/* Regie-Einschübe */
.regie{background:var(--regie-soft);border:1px solid var(--regie-rule);border-left:3px solid var(--regie);
  border-radius:0 3px 3px 0;padding:13px 16px;margin:16px 0;font-size:14px;color:var(--ink)}
.regie .kopf{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--regie);margin-bottom:6px}
.regie p{margin:0 0 7px}
.regie ul{margin:6px 0 0;padding-left:18px}
.regie li{margin-bottom:5px}
.regie code{font-family:var(--mono);font-size:12.5px;background:var(--card);padding:1px 5px;border-radius:2px;border:1px solid var(--regie-rule)}
body.ohne-regie .regie,
body.ohne-regie .nur-regie,
body.ohne-regie .frage .nr{display:none}

/* Navigation */
.nav{max-width:620px;margin:18px auto 0;display:flex;gap:12px;align-items:center}
.nav .rest{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.knopf{padding:10px 20px;border-radius:3px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.knopf.sek{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.knopf[disabled]{opacity:.42;cursor:not-allowed}

/* Gesamtübersicht */
.uebersicht .karte{margin-bottom:22px}
.kennzahlen{max-width:620px;margin:0 auto 24px;display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;background:var(--card);overflow:hidden}
.kennzahlen div{flex:1 1 130px;padding:13px 16px;border-right:1px solid var(--rule-2)}
.kennzahlen div:last-child{border-right:0}
.kennzahlen dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kennzahlen dd{margin:3px 0 0;font-family:var(--serif);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.kennzahlen dd small{font-size:13px;font-family:var(--sans);font-weight:400;color:var(--ink-2)}
.trenner{max-width:620px;margin:30px auto 14px;display:flex;align-items:center;gap:13px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--regie)}
.trenner::after{content:"";flex:1;height:1px;background:var(--regie-rule)}
@media (max-width:620px){ .karte-innen{padding:22px 18px} .leiste-innen{padding:9px 14px} .buehne{padding:18px 14px 70px} }
</style>

<div class="leiste">
  <div class="leiste-innen">
    <span class="marke"><b>Vignettenstudie Wissenslücke × KI</b><span>Vorschau für die Begutachtung</span></span>
    <span class="gruppen" id="gruppen"><span class="gl">Gruppe</span></span>
    <span class="schalter" id="modus">
      <button data-modus="klick" aria-pressed="true">Durchklicken</button>
      <button data-modus="alles" aria-pressed="false">Gesamtübersicht</button>
    </span>
    <label class="regieschalter"><input type="checkbox" id="regieAn" checked> Regie-Notizen</label>
    <div class="zustand">
      <span>Bedingung: <b id="zBedingung"></b></span>
      <span>Seite <b id="zSeite"></b></span>
      <span class="fortschritt"><i id="zBalken"></i></span>
    </div>
  </div>
</div>

<div class="buehne" id="buehne"></div>

<script>
/* ====================== Bedingungen ====================== */
const GRUPPEN = {
  V1: { luecke: "hoch",    tool: "ohne", kurz: "hohe Lücke · ohne Tool" },
  V2: { luecke: "hoch",    tool: "mit",  kurz: "hohe Lücke · mit Tool" },
  V3: { luecke: "niedrig", tool: "ohne", kurz: "niedrige Lücke · ohne Tool" },
  V4: { luecke: "niedrig", tool: "mit",  kurz: "niedrige Lücke · mit Tool" },
};

/* ====================== Skalen ====================== */
const S_KI   = { n: 7, links: "Gar nicht", rechts: "Auf jeden Fall" };
const S_BFI  = { n: 5, links: "trifft überhaupt nicht zu", rechts: "trifft voll und ganz zu",
                 labels: ["trifft überhaupt nicht zu", "trifft eher nicht zu", "weder noch", "eher zutreffend", "trifft voll und ganz zu"] };
const S_PASA = { n: 6, links: "ganz falsch", rechts: "ganz richtig",
                 labels: ["ganz falsch", "ziemlich falsch", "etwas falsch", "etwas richtig", "ziemlich richtig", "ganz richtig"] };
const S_5    = { n: 5, links: "gar nicht", rechts: "sehr stark" };

/* ====================== Items ====================== */
const BLOCK_A = [
  { id: "A1", text: "Wie alt sind Sie?", typ: "zahl", einheit: "Jahre", pflicht: true,
    hinweis: "unter 18 → Ausschluss" },
  { id: "A2", text: "Welchem Geschlecht ordnen Sie sich zu?", typ: "radio", pflicht: true,
    optionen: ["männlich", "weiblich", "divers", "keine Angabe"] },
  { id: "A3", text: "Was ist Ihr höchster Bildungsabschluss?", typ: "radio", pflicht: true,
    optionen: ["Kein Abschluss", "Haupt- bzw. Volksschulabschluss", "Mittlere Reife",
               "Abitur bzw. Fachhochschulreife", "Abgeschlossene Berufsausbildung",
               "Bachelor", "Master bzw. Diplom", "Promotion"] },
  { id: "A4", text: "Was trifft derzeit auf Sie zu?", hinweis: "Mehrfachauswahl möglich", typ: "check", pflicht: true,
    optionen: ["Studium", "Ausbildung", "Berufstätig in Vollzeit", "Berufstätig in Teilzeit",
               "Werkstudent:in bzw. Minijob", "Nicht berufstätig"] },
  { id: "A5", text: "In welchem Bereich sind Sie (hauptsächlich) tätig?", typ: "radio", pflicht: true, filter: "beruf",
    optionen: ["Vertrieb bzw. Key Account", "Einkauf", "Finanzen bzw. Controlling", "Personal",
               "Marketing", "Logistik bzw. Supply Chain", "IT", "Kundenservice", "Sonstiges"] },
  { id: "A6", text: "Wie viele Jahre Berufserfahrung haben Sie insgesamt?", typ: "zahl", einheit: "Jahre", pflicht: true, filter: "beruf" },
  { id: "A7", text: "Wie lange sind Sie bereits bei Ihrem aktuellen Arbeitgeber beschäftigt?", typ: "radio", pflicht: true, filter: "beruf",
    optionen: ["unter 1 Jahr", "1–3 Jahre", "4–10 Jahre", "mehr als 10 Jahre"] },
  { id: "A8", text: "Wie viele Mitarbeitende hat Ihr aktuelles Unternehmen ungefähr?", typ: "radio", filter: "beruf",
    hinweis: "freiwillig", optionen: ["unter 50", "50–249", "250–999", "1.000 und mehr", "weiß nicht"] },
  { id: "A9", text: "Haben Sie in Ihrem Berufsleben bereits eine größere organisationale Veränderung erlebt (z. B. Umstrukturierung, neue Zuständigkeiten, neue Prozesse)?",
    typ: "radio", pflicht: true, optionen: ["ja", "nein", "unsicher"] },
  { id: "A10", text: "Wie stark waren Sie persönlich von dieser Veränderung betroffen?", typ: "skala", skala: S_5, pflicht: true, filter: "A9ja" },
  { id: "A11", text: "Sind Ihnen die Begriffe „künstliche Intelligenz“ oder „KI“ vertraut?", typ: "radio", pflicht: true,
    optionen: ["ja", "nein", "unsicher"] },
  { id: "A12", text: "Wie häufig nutzen Sie KI-Anwendungen (z. B. ChatGPT, Copilot)?", typ: "radio", pflicht: true,
    optionen: ["nie", "seltener als monatlich", "monatlich", "wöchentlich", "täglich"] },
];

const BLOCK_B = [
  ["B1", "Inwieweit sind Sie der Meinung, dass künstliche Intelligenz die Welt verbessern wird?"],
  ["B2", "Wie sehr möchten Sie Technologien nutzen, die auf künstlicher Intelligenz basieren?"],
  ["B3", "Wie sehr freuen Sie sich auf zukünftige Entwicklungen im Bereich künstliche Intelligenz?"],
  ["B4", "Inwieweit glauben Sie, dass künstliche Intelligenz Lösungen für globale Probleme bietet?"],
  ["B5", "Haben Sie hauptsächlich positive Gefühle, wenn Sie an künstliche Intelligenz denken?"],
  ["B6", "Inwieweit würden Sie sich eher für eine Technologie mit künstlicher Intelligenz entscheiden als für eine ohne?"],
].map(([id, text]) => ({ id, text, typ: "skala", skala: S_KI, pflicht: true }));

const BLOCK_C = [
  ["C1", "… bin eher zurückhaltend, reserviert."],
  ["C2", "… schenke anderen leicht Vertrauen, glaube an das Gute im Menschen."],
  ["C3", "… bin bequem, neige zur Faulheit."],
  ["C4", "… bin entspannt, lasse mich durch Stress nicht aus der Ruhe bringen."],
  ["C5", "… habe nur wenig künstlerisches Interesse."],
  ["C6", "… gehe aus mir heraus, bin gesellig."],
  ["C7", "… neige dazu, andere zu kritisieren."],
  ["C8", "… erledige Aufgaben gründlich."],
  ["C9", "… werde leicht nervös und unsicher."],
  ["C10", "… habe eine aktive Vorstellungskraft, bin fantasievoll."],
].map(([id, text]) => ({ id, text, typ: "skala", skala: S_BFI, pflicht: true }));

const PASA = [
  "Ich fühle mich durch die Situation nicht bedroht.",
  "Die Situation ist für mich von Bedeutung (relevant).",
  "In dieser Situation weiß ich, was ich tun kann.",
  "Es hängt hauptsächlich von mir ab, ob ich die Situation bewältige.",
  "Diese Situation ist mir sehr unangenehm.",
  "Diese Situation lässt mich kalt.",
  "Ich weiß überhaupt nicht, was ich jetzt machen soll.",
  "Ich kann mich am besten selbst durch mein Verhalten vor Misserfolg in dieser Situation schützen.",
  "Ich fühle mich nicht beunruhigt, da die Situation keine Bedrohung für mich darstellt.",
  "Die Situation ist keine Herausforderung für mich.",
  "In dieser Situation fallen mir viele Handlungsalternativen ein.",
  "Ich kann sehr viel von dem, was in dieser Situation passiert, selbst bestimmen.",
  "Diese Situation macht mir Angst.",
  "Diese Situation fordert mich heraus.",
  "Für diese Situation fallen mir viele Lösungen ein.",
  "Wenn ich die Situation bewältige, ist das Folge meiner Anstrengung und meines persönlichen Einsatzes.",
].map((text, i) => ({ id: "PASA" + (i + 1), text, typ: "skala", skala: S_PASA, pflicht: true }));

function manipulation(g) {
  const items = [
    { id: "MC1", text: "Ich wüsste, wie ich bei der Reklamation vorgehen muss.", typ: "skala", skala: S_PASA, pflicht: true },
    { id: "MC2", text: "Ich wüsste, an wen ich mich wenden kann.", typ: "skala", skala: S_PASA, pflicht: true },
    { id: "MC3", text: "Ich wüsste, was dem Kunden bisher zugesagt wurde.", typ: "skala", skala: S_PASA, pflicht: true },
    { id: "MC4", text: "In der beschriebenen Situation stand mir ein KI-Assistent zur Verfügung.", typ: "radio", optionen: ["ja", "nein"], pflicht: true },
  ];
  if (GRUPPEN[g].tool === "mit")
    items.push({ id: "MC5", text: "Das beschriebene KI-Tool würde mir in dieser Situation helfen.", typ: "skala", skala: S_PASA, pflicht: true });
  return items;
}

/* ====================== Seiten ====================== */
const SEITEN = [
  {
    block: "Einstieg", titel: "Begrüßung und Einwilligung", min: 0.5,
    text: () => `
      <p class="anrede">Liebe Teilnehmerin, lieber Teilnehmer,</p>
      <p>vielen Dank, dass Sie sich Zeit für diese Studie nehmen. Im Rahmen meiner Bachelorarbeit an der FOM Hochschule untersuche ich, wie Menschen Arbeitssituationen in Unternehmen erleben, die sich gerade verändern.</p>
      <p>Sie werden zunächst einige Fragen zu Ihrer Person beantworten und sich anschließend in eine kurze Arbeitssituation hineinversetzen. Die Bearbeitung dauert etwa <strong>12 Minuten</strong>. Es gibt keine richtigen oder falschen Antworten; uns interessiert allein Ihre persönliche Einschätzung.</p>
      <p>Ihre Teilnahme ist freiwillig und kann jederzeit ohne Angabe von Gründen abgebrochen werden. Alle Angaben werden anonym erhoben, ausschließlich für wissenschaftliche Zwecke ausgewertet und nicht an Dritte weitergegeben. Rückschlüsse auf einzelne Personen sind nicht möglich.</p>
      <p>Bei Fragen erreichen Sie mich unter: <strong>[E-Mail]</strong></p>
      <p>Isabella Dietrich</p>
      <hr>
      <label class="einwilligung"><input type="checkbox" id="consent">
        <span>Ich bin mindestens 18 Jahre alt, habe die Informationen gelesen und bin mit der Teilnahme einverstanden.</span></label>

/* ====================== Zustand ====================== */
let gruppe = "V1", modus = "klick", seite = 0;
const antworten = {};

const istBeruf = () => ["Berufstätig in Vollzeit", "Berufstätig in Teilzeit", "Werkstudent:in bzw. Minijob"]
  .some((x) => (antworten.A4 || []).includes(x));
const sichtbar = (it) =>
  it.filter === "beruf" ? istBeruf() : it.filter === "A9ja" ? antworten.A9 === "ja" : true;

/* ====================== Bausteine ====================== */
function skalaHtml(it) {
  const s = it.skala, p = [];
  for (let i = 1; i <= s.n; i++)
    p.push(`<label class="punkt"><span class="n">${i}</span>
      <input type="radio" name="${it.id}" value="${i}" data-id="${it.id}">
      ${s.labels ? `<span class="lab">${s.labels[i - 1]}</span>` : ""}</label>`);
  return `<div class="skala">
    <div class="pole"><span>${s.links}</span><span>${s.rechts}</span></div>
    <div class="punkte">${p.join("")}</div></div>`;
}

function itemHtml(it) {
  let koerper = "";
  if (it.typ === "zahl")
    koerper = `<div class="opts"><input type="number" min="0" max="120" data-id="${it.id}" placeholder="${it.einheit || ""}"></div>`;
  else if (it.typ === "radio" || it.typ === "check")
    koerper = `<div class="opts">${it.optionen.map((o) =>
      `<label class="opt"><input type="${it.typ === "radio" ? "radio" : "checkbox"}" name="${it.id}" value="${o}" data-id="${it.id}"><span>${o}</span></label>`).join("")}</div>`;
  else if (it.typ === "skala") koerper = skalaHtml(it);
  else if (it.typ === "text")
    koerper = `<div class="opts"><textarea data-id="${it.id}" placeholder="Ihre Antwort …"></textarea></div>`;
  return `<div class="item${sichtbar(it) ? "" : " versteckt"}" data-item="${it.id}" data-filter="${it.filter || ""}">
    <div class="frage"><span class="nr">${it.id}</span><span class="txt">${it.text}${
      it.pflicht ? ' <span class="pflicht">*</span>' : ""}${it.hinweis ? `<em>${it.hinweis}</em>` : ""}</span></div>
    ${koerper}</div>`;
}

function seiteHtml(s, idx) {
  const items = s.items(gruppe).map(itemHtml).join("");
  const regie = typeof s.regie === "function" ? s.regie(gruppe) : s.regie || "";
  return `<div class="ueber">
      <span class="block">${s.block}</span>
      ${s.variiert ? `<span class="block nur-regie" style="color:var(--regie)">variiert: ${s.variiert}</span>` : ""}
      <span class="zaehler">Seite ${idx + 1} von ${SEITEN.length}</span></div>
    <section class="karte"><div class="karte-innen">
      <h1>${s.titel}</h1>
      ${s.text(gruppe)}
      ${items ? `<div class="items">${items}</div>` : ""}
      ${regie}
    </div></section>`;
}

/* ====================== Kennzahlen ====================== */
function kennzahlen() {
  const items = SEITEN.reduce((n, s) => n + s.items(gruppe).length, 0);
  const pflicht = SEITEN.reduce((n, s) => n + s.items(gruppe).filter((i) => i.pflicht).length, 0);
  const min = SEITEN.reduce((n, s) => n + s.min, 0);
  const vig = SEITEN.filter((s) => s.block.startsWith("Vignette")).reduce((n, s) => n + s.min, 0);
  return { items, pflicht, min, vig };
}

/* ====================== Zeichnen ====================== */
const buehne = document.getElementById("buehne");

function zeichnen() {
  if (modus === "klick") {
    buehne.className = "buehne";
    const s = SEITEN[seite];
    const rest = SEITEN.slice(seite).reduce((n, x) => n + x.min, 0);
    buehne.innerHTML = seiteHtml(s, seite) + `
      <div class="nav">
        <button class="knopf sek" id="zurueck"${seite === 0 ? " disabled" : ""}>Zurück</button>
        <button class="knopf" id="weiter"${seite === SEITEN.length - 1 ? " disabled" : ""}>Weiter</button>
        <span class="rest">noch ca. ${Math.max(1, Math.round(rest))} Min.</span>
      </div>`;
    document.getElementById("zurueck").onclick = () => { seite = Math.max(0, seite - 1); zeichnen(); scrollTo({ top: 0 }); };
    document.getElementById("weiter").onclick = () => { seite = Math.min(SEITEN.length - 1, seite + 1); zeichnen(); scrollTo({ top: 0 }); };
    const c = document.getElementById("consent");
    if (c) {
      const w = document.getElementById("weiter");
      w.disabled = !c.checked;
      c.onchange = () => { w.disabled = !c.checked; };
    }
  } else {
    buehne.className = "buehne uebersicht";
    const k = kennzahlen();
    buehne.innerHTML = `
      <dl class="kennzahlen">
        <div><dt>Seiten</dt><dd>${SEITEN.length}</dd></div>
        <div><dt>Items</dt><dd>${k.items} <small>davon ${k.pflicht} Pflicht</small></dd></div>
        <div><dt>Dauer gesamt</dt><dd>≈ ${Math.round(k.min)} <small>Min.</small></dd></div>
        <div><dt>davon Vignette</dt><dd>≈ ${Math.round(k.vig)} <small>Min.</small></dd></div>
      </dl>` +
      SEITEN.map((s, i) => seiteHtml(s, i)).join("");
  }
  verdrahten();
  zustand();
}

function verdrahten() {
  buehne.querySelectorAll("input[data-id], textarea[data-id]").forEach((el) => {
    el.addEventListener("change", () => {
      const id = el.dataset.id;
      if (el.type === "checkbox") {
        antworten[id] = [...buehne.querySelectorAll(`input[data-id="${id}"]:checked`)].map((x) => x.value);
      } else antworten[id] = el.value;
      filterPruefen();
    });
  });
  filterPruefen();
}

function filterPruefen() {
  buehne.querySelectorAll(".item[data-filter]").forEach((el) => {
    const f = el.dataset.filter;
    if (!f) return;
    const zeigen = f === "beruf" ? istBeruf() : f === "A9ja" ? antworten.A9 === "ja" : true;
    el.classList.toggle("versteckt", !zeigen);
  });
}

function zustand() {
  document.getElementById("zBedingung").textContent = gruppe + " · " + GRUPPEN[gruppe].kurz;
  document.getElementById("zSeite").textContent =
    modus === "klick" ? `${seite + 1} / ${SEITEN.length}` : `alle ${SEITEN.length}`;
  document.getElementById("zBalken").style.width =
    modus === "klick" ? ((seite + 1) / SEITEN.length) * 100 + "%" : "100%";
}

/* ====================== Bedienung ====================== */
const gBox = document.getElementById("gruppen");
Object.keys(GRUPPEN).forEach((k) => {
  const b = document.createElement("button");
  b.className = "gbtn"; b.textContent = k; b.title = GRUPPEN[k].kurz;
  b.setAttribute("aria-pressed", String(k === gruppe));
  b.onclick = () => { gruppe = k; markieren(); zeichnen(); };
  gBox.appendChild(b);
});
const wuerfel = document.createElement("button");
wuerfel.className = "gbtn wuerfel"; wuerfel.textContent = "Zufall";
wuerfel.title = "So wie im echten Fragebogen: zufällige Zuweisung";
wuerfel.onclick = () => {
  const k = Object.keys(GRUPPEN);
  gruppe = k[Math.floor(Math.random() * k.length)];
  markieren(); zeichnen();
};
gBox.appendChild(wuerfel);

function markieren() {
  gBox.querySelectorAll(".gbtn").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.textContent === gruppe)));
}

document.getElementById("modus").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-modus]");
  if (!b) return;
  modus = b.dataset.modus;
  document.querySelectorAll("#modus button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x === b)));
  zeichnen(); scrollTo({ top: 0 });
});

document.getElementById("regieAn").addEventListener("change", (e) => {
  document.body.classList.toggle("ohne-regie", !e.target.checked);
});

zeichnen();
</script>
